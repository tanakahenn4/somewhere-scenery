<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSSテープ配色テスト</title>
  <style>
    :root {
      --edge-color-1: 214, 180, 255;
      --edge-color-2: 111, 55, 165;
      --stripe-color-1: 158, 105, 218;
      --stripe-color-2: 232, 125, 194;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 18px;
      color: #26222b;
      font-family: "Segoe UI", sans-serif;
      background: #292930;
    }

    main {
      width: min(680px, 100%);
      margin: 0 auto;
      padding: 24px;
      background: #f4f2f5;
      border-radius: 10px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.28);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 21px;
    }

    .description {
      margin: 0 0 22px;
      color: #625d67;
      font-size: 14px;
    }

    .preview {
      display: grid;
      place-items: center;
      min-height: 150px;
      margin-bottom: 22px;
      background:
        repeating-linear-gradient(180deg, transparent 0 24px, rgba(132, 143, 150, 0.2) 24px 25px),
        linear-gradient(100deg, #ebebe7 0%, #f8f8f5 50%, #e8e8e4 100%);
      border: 1px solid #d1cdd3;
    }

    #tapePreview {
      width: 104px;
      height: 25px;
      background:
        linear-gradient(90deg, rgba(var(--edge-color-1), 0.2), transparent 18% 82%, rgba(var(--edge-color-2), 0.08)),
        repeating-linear-gradient(102deg, rgba(var(--stripe-color-1), 0.68) 0 4px, rgba(var(--stripe-color-2), 0.58) 4px 9px);
      box-shadow: 0 1px 2px rgba(75, 58, 30, 0.16);
      opacity: 0.76;
      transform: rotate(-1.4deg);
      clip-path: polygon(
        0 7%, 7% 1%, 15% 5%, 24% 0, 34% 4%, 45% 1%,
        56% 5%, 67% 0, 78% 4%, 89% 1%, 100% 6%,
        98% 94%, 88% 99%, 77% 95%, 66% 100%, 55% 96%,
        44% 100%, 33% 95%, 22% 99%, 11% 95%, 2% 100%
      );
    }

    .color-controls {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .color-control {
      display: grid;
      grid-template-columns: 46px 1fr;
      gap: 10px;
      align-items: center;
      padding: 10px;
      background: #fff;
      border: 1px solid #d9d5dc;
      border-radius: 7px;
    }

    .color-control input {
      width: 46px;
      height: 36px;
      padding: 2px;
      background: transparent;
      border: 1px solid #aaa3af;
      border-radius: 4px;
      cursor: pointer;
    }

    .color-control strong,
    .color-control output {
      display: block;
    }

    .color-control strong {
      font-size: 13px;
    }

    .color-control output {
      margin-top: 3px;
      color: #6e6872;
      font: 12px Consolas, monospace;
    }

    label[for="cssOutput"] {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }

    #cssOutput {
      display: block;
      width: 100%;
      min-height: 92px;
      padding: 10px;
      resize: vertical;
      color: #28232c;
      font: 12px/1.55 Consolas, monospace;
      background: #fff;
      border: 1px solid #bdb7c1;
      border-radius: 5px;
    }

    .copy-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 9px;
    }

    #copyButton {
      padding: 7px 13px;
      color: #fff;
      background: #65517d;
      border: 0;
      border-radius: 5px;
      cursor: pointer;
    }

    #copyStatus {
      color: #625d67;
      font-size: 13px;
    }

    @media (max-width: 560px) {
      main {
        padding: 18px;
      }

      .color-controls {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>CSSテープ配色テスト</h1>
    <p class="description">形状と透明度は固定したまま、4つの色だけを変更できます。</p>

    <div class="preview" aria-label="テープのプレビュー">
      <div id="tapePreview"></div>
    </div>

    <div class="color-controls">
      <label class="color-control">
        <input id="edgeColor1" type="color" value="#d6b4ff">
        <span><strong>左右の色むら1</strong><output for="edgeColor1"></output></span>
      </label>
      <label class="color-control">
        <input id="edgeColor2" type="color" value="#6f37a5">
        <span><strong>左右の色むら2</strong><output for="edgeColor2"></output></span>
      </label>
      <label class="color-control">
        <input id="stripeColor1" type="color" value="#9e69da">
        <span><strong>筋の色1</strong><output for="stripeColor1"></output></span>
      </label>
      <label class="color-control">
        <input id="stripeColor2" type="color" value="#e87dc2">
        <span><strong>筋の色2</strong><output for="stripeColor2"></output></span>
      </label>
    </div>

    <label for="cssOutput">現在のCSS（そのままコピーできます）</label>
    <textarea id="cssOutput" readonly></textarea>
    <div class="copy-row">
      <button id="copyButton" type="button">RGBA値をコピー</button>
      <span id="copyStatus" role="status" aria-live="polite"></span>
    </div>
  </main>

  <script>
    const colorSettings = [
      { inputId: "edgeColor1", cssVariable: "--edge-color-1", alpha: 0.2 },
      { inputId: "edgeColor2", cssVariable: "--edge-color-2", alpha: 0.08 },
      { inputId: "stripeColor1", cssVariable: "--stripe-color-1", alpha: 0.68 },
      { inputId: "stripeColor2", cssVariable: "--stripe-color-2", alpha: 0.58 }
    ];

    const cssOutput = document.getElementById("cssOutput");
    const copyStatus = document.getElementById("copyStatus");

    function hexToRgb(hex) {
      return [
        Number.parseInt(hex.slice(1, 3), 16),
        Number.parseInt(hex.slice(3, 5), 16),
        Number.parseInt(hex.slice(5, 7), 16)
      ];
    }

    function updateTapeColors() {
      const values = colorSettings.map(setting => {
        const input = document.getElementById(setting.inputId);
        const rgb = hexToRgb(input.value);
        document.documentElement.style.setProperty(setting.cssVariable, rgb.join(", "));
        input.parentElement.querySelector("output").textContent =
          `rgba(${rgb.join(", ")}, ${setting.alpha})`;
        return { rgb, alpha: setting.alpha };
      });

      cssOutput.value = `background:\n  linear-gradient(90deg, rgba(${values[0].rgb.join(", ")}, ${values[0].alpha}), transparent 18% 82%, rgba(${values[1].rgb.join(", ")}, ${values[1].alpha})),\n  repeating-linear-gradient(102deg, rgba(${values[2].rgb.join(", ")}, ${values[2].alpha}) 0 4px, rgba(${values[3].rgb.join(", ")}, ${values[3].alpha}) 4px 9px);`;
      copyStatus.textContent = "";
    }

    colorSettings.forEach(setting => {
      document.getElementById(setting.inputId).addEventListener("input", updateTapeColors);
    });

    document.getElementById("copyButton").addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(cssOutput.value);
        copyStatus.textContent = "コピーしました。";
      } catch {
        cssOutput.select();
        document.execCommand("copy");
        copyStatus.textContent = "コピーしました。";
      }
    });

    updateTapeColors();
  </script>
</body>
</html>
