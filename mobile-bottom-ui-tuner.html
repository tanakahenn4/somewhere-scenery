<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>横持ちスマホ 下部UI調整ツール</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", "Yu Gothic UI", sans-serif;
      background: #111318;
      color: #edf0f6;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; min-height: 100%; }
    body { min-height: 100vh; }
    button, input, select, textarea { font: inherit; }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 14px;
      background: #191c23;
      border-bottom: 1px solid #343946;
    }

    .app-header h1 { margin: 0; font-size: 16px; }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; }
    .toolbar label { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: #cbd0dc; }
    .toolbar select, .toolbar input, .toolbar button,
    .copy-button, .reset-button {
      min-height: 30px;
      border: 1px solid #4a5060;
      border-radius: 4px;
      color: #f5f6fa;
      background: #262a34;
    }
    .toolbar input { width: 70px; padding: 4px 6px; }
    .toolbar select, .toolbar button, .copy-button, .reset-button { padding: 5px 9px; cursor: pointer; }
    button:hover { background: #343947; }
    button:disabled { opacity: .4; cursor: default; }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 390px;
      min-height: calc(100vh - 52px);
    }

    .preview-pane {
      min-width: 0;
      padding: 18px;
      overflow: auto;
      background:
        linear-gradient(45deg, #171a20 25%, transparent 25%),
        linear-gradient(-45deg, #171a20 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #171a20 75%),
        linear-gradient(-45deg, transparent 75%, #171a20 75%), #20242c;
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0;
    }

    .preview-caption {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      font-size: 12px;
      color: #bac1cf;
    }

    .device-shell {
      width: fit-content;
      margin: 0 auto;
      padding: 7px;
      border: 1px solid #4b5262;
      border-radius: 11px;
      background: #08090c;
      box-shadow: 0 14px 40px rgba(0,0,0,.42);
    }

    #sitePreview {
      display: block;
      width: 844px;
      height: 390px;
      border: 0;
      background: #fff;
    }

    .preview-message {
      display: none;
      width: min(640px, 100%);
      margin: 20px auto;
      padding: 14px;
      border: 1px solid #77576e;
      background: #35252f;
      color: #ffe7f6;
      line-height: 1.6;
    }

    .inspector {
      border-left: 1px solid #343946;
      background: #181b21;
      overflow: auto;
      max-height: calc(100vh - 52px);
    }

    .inspector-inner { padding: 14px; }
    .inspector h2 { margin: 0 0 6px; font-size: 15px; }
    .hint { margin: 0 0 12px; color: #aeb5c3; font-size: 12px; line-height: 1.55; }

    details {
      margin-bottom: 8px;
      border: 1px solid #353b48;
      border-radius: 5px;
      background: #20242c;
    }
    summary { padding: 9px 10px; cursor: pointer; font-size: 13px; font-weight: 600; }
    .control-list { display: grid; gap: 9px; padding: 3px 10px 11px; }

    .control-row {
      display: grid;
      grid-template-columns: 112px minmax(80px, 1fr) 66px;
      align-items: center;
      gap: 7px;
      font-size: 12px;
    }
    .control-row input[type="range"] { width: 100%; accent-color: #9a75dc; }
    .control-row input[type="number"] {
      width: 66px;
      padding: 4px 5px;
      color: #fff;
      background: #11141a;
      border: 1px solid #454b58;
      border-radius: 3px;
    }
    .control-row input[type="color"] {
      width: 40px;
      height: 27px;
      padding: 2px;
      border: 1px solid #454b58;
      background: #11141a;
    }
    .color-value { color: #aeb5c3; font-family: Consolas, monospace; }

    .output-section { margin-top: 14px; }
    .output-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 7px; }
    .output-head h2 { margin: 0; }
    #cssOutput {
      width: 100%;
      min-height: 270px;
      resize: vertical;
      padding: 10px;
      border: 1px solid #414856;
      border-radius: 4px;
      background: #0d0f13;
      color: #d8dded;
      font: 11px/1.5 Consolas, "Courier New", monospace;
      tab-size: 2;
    }
    #status { min-height: 18px; margin-top: 7px; color: #a9e2bd; font-size: 11px; }

    @media (max-width: 1050px) {
      .workspace { grid-template-columns: 1fr; }
      .inspector { max-height: none; border-left: 0; border-top: 1px solid #343946; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <h1>横持ちスマホ 下部フローティングUI調整</h1>
    <div class="toolbar">
      <label>viewport
        <select id="viewportPreset">
          <option value="915x412">915 × 412</option>
          <option value="844x390" selected>844 × 390</option>
          <option value="740x360">740 × 360</option>
          <option value="custom">カスタム</option>
        </select>
      </label>
      <label>幅 <input id="viewportWidth" type="number" min="480" max="1400" value="844"></label>
      <label>高さ <input id="viewportHeight" type="number" min="280" max="600" value="390"></label>
      <button id="reloadPreview" type="button">再読込</button>
      <button id="undoButton" type="button">Undo</button>
      <button id="redoButton" type="button">Redo</button>
    </div>
  </header>

  <main class="workspace">
    <section class="preview-pane" aria-labelledby="previewHeading">
      <div class="preview-caption">
        <span id="previewHeading">実際の index.html（同一オリジン）</span>
        <span id="viewportLabel">844 × 390 CSS px</span>
      </div>
      <div class="device-shell" id="deviceShell">
        <iframe id="sitePreview" src="./index.html" title="index.html 横持ちスマホプレビュー"></iframe>
      </div>
      <div class="preview-message" id="previewMessage"></div>
    </section>

    <aside class="inspector">
      <div class="inspector-inner">
        <h2>CSS調整</h2>
        <p class="hint">変更はiframe内へ一時適用されます。index.htmlには保存されません。</p>

        <div id="controlsPanel"></div>

        <div class="toolbar" style="margin-top:10px">
          <button class="reset-button" id="productionReset" type="button">現在の本番値に戻す</button>
          <button class="reset-button" id="initialReset" type="button">初期値へリセット</button>
          <button class="reset-button" id="clearSaved" type="button">保存状態を削除</button>
        </div>

        <section class="output-section" aria-labelledby="cssHeading">
          <div class="output-head">
            <h2 id="cssHeading">生成CSS</h2>
            <button class="copy-button" id="copyCss" type="button">CSSをコピー</button>
          </div>
          <textarea id="cssOutput" readonly spellcheck="false"></textarea>
          <div id="status" aria-live="polite"></div>
        </section>
      </div>
    </aside>
  </main>

  <script>
    (() => {
      "use strict";

      const STORAGE_KEY = "somewhere_scenery_mobile_bottom_ui_tuner_v1";
      const STYLE_ID = "mobileBottomUiTunerOverrides";

      const productionValues = Object.freeze({
        bottom: 6, left: 6, right: 6, gap: 4,
        searchWidth: 450, searchHeight: 32, searchFont: 14, searchPadX: 10, searchPadY: 6,
        registerWidth: 120, registerHeight: 32, registerFont: 14, registerPadX: 10, registerPadY: 6,
        svWidth: 70, svHeight: 32, svFont: 14, svPadX: 10, svPadY: 6,
        refreshWidth: 85, refreshHeight: 32, refreshFont: 14, refreshPadX: 10, refreshPadY: 6,
        background: "#333333", backgroundOpacity: 1,
        borderWidth: 1, borderColor: "#a7a5a5", borderRadius: 0
      });

      const initialValues = Object.freeze({ ...productionValues });
      let state = { ...initialValues };
      let undoStack = [];
      let redoStack = [];
      let isRestoring = false;

      const sections = [
        { title: "全体配置", open: true, fields: [
          ["bottom", "下端から", 0, 80, 1, "px"],
          ["left", "左端から", 0, 80, 1, "px"],
          ["right", "MENUから", 0, 80, 1, "px"],
          ["gap", "要素間gap", 0, 24, 1, "px"]
        ]},
        { title: "検索欄", open: true, fields: [
          ["searchWidth", "横幅", 120, 700, 1, "px"],
          ["searchHeight", "高さ", 20, 60, 1, "px"],
          ["searchFont", "文字サイズ", 8, 24, .5, "px"],
          ["searchPadX", "左右padding", 0, 24, 1, "px"],
          ["searchPadY", "上下padding", 0, 16, 1, "px"]
        ]},
        { title: "現在位置を登録", fields: buttonFields("register") },
        { title: "SV ON / OFF", fields: buttonFields("sv") },
        { title: "ページ更新", fields: buttonFields("refresh") },
        { title: "共通デザイン", open: true, fields: [
          ["background", "背景色", "color"],
          ["backgroundOpacity", "背景透明度", 0, 1, .01, ""],
          ["borderWidth", "枠線の太さ", 0, 6, 1, "px"],
          ["borderColor", "枠線の色", "color"],
          ["borderRadius", "角丸", 0, 16, 1, "px"]
        ]}
      ];

      function buttonFields(prefix) {
        return [
          [`${prefix}Width`, "横幅", 36, 220, 1, "px"],
          [`${prefix}Height`, "高さ", 20, 60, 1, "px"],
          [`${prefix}Font`, "文字サイズ", 8, 24, .5, "px"],
          [`${prefix}PadX`, "左右padding", 0, 24, 1, "px"],
          [`${prefix}PadY`, "上下padding", 0, 16, 1, "px"]
        ];
      }

      const iframe = document.getElementById("sitePreview");
      const panel = document.getElementById("controlsPanel");
      const output = document.getElementById("cssOutput");
      const status = document.getElementById("status");
      const previewMessage = document.getElementById("previewMessage");

      function createPanel() {
        const fragment = document.createDocumentFragment();
        sections.forEach(section => {
          const details = document.createElement("details");
          details.open = Boolean(section.open);
          const summary = document.createElement("summary");
          summary.textContent = section.title;
          const list = document.createElement("div");
          list.className = "control-list";
          section.fields.forEach(field => list.appendChild(createField(field)));
          details.append(summary, list);
          fragment.appendChild(details);
        });
        panel.appendChild(fragment);
      }

      function createField(field) {
        const [key, labelText, kindOrMin, max, step, unit] = field;
        const row = document.createElement("label");
        row.className = "control-row";
        row.dataset.key = key;
        const label = document.createElement("span");
        label.textContent = labelText;
        row.appendChild(label);

        if (kindOrMin === "color") {
          const color = document.createElement("input");
          color.type = "color";
          color.value = state[key];
          color.dataset.stateKey = key;
          const value = document.createElement("span");
          value.className = "color-value";
          value.textContent = state[key];
          color.addEventListener("input", () => {
            value.textContent = color.value;
            setValue(key, color.value);
          });
          row.append(color, value);
          return row;
        }

        const range = document.createElement("input");
        range.type = "range";
        range.min = kindOrMin;
        range.max = max;
        range.step = step;
        range.value = state[key];
        range.dataset.stateKey = key;

        const number = document.createElement("input");
        number.type = "number";
        number.min = kindOrMin;
        number.max = max;
        number.step = step;
        number.value = state[key];
        number.title = unit || "";
        number.dataset.stateKey = key;

        const update = value => {
          const numeric = Number(value);
          if (!Number.isFinite(numeric)) return;
          range.value = numeric;
          number.value = numeric;
          setValue(key, numeric);
        };
        range.addEventListener("input", () => update(range.value));
        number.addEventListener("change", () => update(number.value));
        row.append(range, number);
        return row;
      }

      function snapshot() { return JSON.stringify(state); }

      function setValue(key, value) {
        if (state[key] === value) return;
        if (!isRestoring) {
          undoStack.push(snapshot());
          if (undoStack.length > 100) undoStack.shift();
          redoStack = [];
        }
        state[key] = value;
        render();
      }

      function restore(nextState, recordHistory = true) {
        if (recordHistory) undoStack.push(snapshot());
        redoStack = [];
        state = { ...initialValues, ...nextState };
        isRestoring = true;
        syncInputs();
        isRestoring = false;
        render();
      }

      function syncInputs() {
        document.querySelectorAll("[data-state-key]").forEach(input => {
          const key = input.dataset.stateKey;
          input.value = state[key];
          if (input.type === "color") {
            const display = input.parentElement.querySelector(".color-value");
            if (display) display.textContent = state[key];
          }
        });
      }

      function hexToRgba(hex, alpha) {
        const value = hex.replace("#", "");
        const red = parseInt(value.slice(0, 2), 16);
        const green = parseInt(value.slice(2, 4), 16);
        const blue = parseInt(value.slice(4, 6), 16);
        return `rgba(${red}, ${green}, ${blue}, ${Number(alpha).toFixed(2)})`;
      }

      function declarations(indent = "  ") {
        const bg = hexToRgba(state.background, state.backgroundOpacity);
        return `${indent}#topBar {
${indent}  display: none;
${indent}}

${indent}#controls {
${indent}  position: absolute;
${indent}  left: ${state.left}px;
${indent}  right: calc(var(--side-navigation-width) + ${state.right}px);
${indent}  bottom: ${state.bottom}px;
${indent}  z-index: 1002;
${indent}  display: flex;
${indent}  align-items: center;
${indent}  flex-wrap: nowrap;
${indent}  gap: ${state.gap}px;
${indent}  padding: 0;
${indent}  background: transparent;
${indent}}

${indent}#controls input,
${indent}#controls button {
${indent}  box-sizing: border-box;
${indent}  margin: 0;
${indent}  background: ${bg};
${indent}  border: ${state.borderWidth}px solid ${state.borderColor};
${indent}  border-radius: ${state.borderRadius}px;
${indent}}

${indent}#addressInput {
${indent}  flex: 0 0 ${state.searchWidth}px;
${indent}  width: ${state.searchWidth}px !important;
${indent}  min-width: 0;
${indent}  height: ${state.searchHeight}px;
${indent}  padding: ${state.searchPadY}px ${state.searchPadX}px;
${indent}  font-size: ${state.searchFont}px;
${indent}}

${indent}#getPosButton {
${indent}  flex: 0 0 ${state.registerWidth}px;
${indent}  width: ${state.registerWidth}px;
${indent}  height: ${state.registerHeight}px;
${indent}  padding: ${state.registerPadY}px ${state.registerPadX}px;
${indent}  font-size: ${state.registerFont}px;
${indent}}

${indent}#streetViewCoverageButton {
${indent}  flex: 0 0 ${state.svWidth}px;
${indent}  width: ${state.svWidth}px;
${indent}  height: ${state.svHeight}px;
${indent}  padding: ${state.svPadY}px ${state.svPadX}px;
${indent}  font-size: ${state.svFont}px;
${indent}}

${indent}#loadDataButton {
${indent}  flex: 0 0 ${state.refreshWidth}px;
${indent}  width: ${state.refreshWidth}px;
${indent}  height: ${state.refreshHeight}px;
${indent}  padding: ${state.refreshPadY}px ${state.refreshPadX}px;
${indent}  font-size: ${state.refreshFont}px;
${indent}}`;
      }

      function buildGeneratedCss() {
        return `@media (orientation: landscape) and (max-height: 600px) and (hover: none) and (pointer: coarse) {
${declarations("  ")}
}`;
      }

      function buildPreviewCss() {
        return `/* mobile-bottom-ui-tuner.html による一時プレビュー */
${declarations("").replaceAll(" !important", "").replaceAll(";\n", " !important;\n")}`;
      }

      function applyToIframe() {
        try {
          const doc = iframe.contentDocument;
          if (!doc || !doc.head) throw new Error("iframe document is not ready");
          let style = doc.getElementById(STYLE_ID);
          if (!style) {
            style = doc.createElement("style");
            style.id = STYLE_ID;
            doc.head.appendChild(style);
          }
          style.textContent = buildPreviewCss();
          previewMessage.style.display = "none";
          document.getElementById("deviceShell").style.display = "block";
        } catch (error) {
          document.getElementById("deviceShell").style.display = "none";
          previewMessage.style.display = "block";
          previewMessage.textContent = "index.htmlへアクセスできません。同一フォルダをローカルサーバーで配信し、http://localhost:.../mobile-bottom-ui-tuner.html を開いてください。";
        }
      }

      function render() {
        output.value = buildGeneratedCss();
        applyToIframe();
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (_) {}
        document.getElementById("undoButton").disabled = undoStack.length === 0;
        document.getElementById("redoButton").disabled = redoStack.length === 0;
      }

      function setViewport(width, height) {
        iframe.style.width = `${width}px`;
        iframe.style.height = `${height}px`;
        document.getElementById("viewportLabel").textContent = `${width} × ${height} CSS px`;
      }

      function updateViewportFromInputs() {
        const width = Math.max(480, Number(document.getElementById("viewportWidth").value) || 844);
        const height = Math.max(280, Number(document.getElementById("viewportHeight").value) || 390);
        setViewport(width, height);
      }

      function loadSavedState() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (saved && typeof saved === "object") state = { ...initialValues, ...saved };
        } catch (_) {
          state = { ...initialValues };
        }
      }

      function announce(message) {
        status.textContent = message;
        window.clearTimeout(announce.timer);
        announce.timer = window.setTimeout(() => { status.textContent = ""; }, 2600);
      }

      document.getElementById("viewportPreset").addEventListener("change", event => {
        if (event.target.value === "custom") return;
        const [width, height] = event.target.value.split("x").map(Number);
        document.getElementById("viewportWidth").value = width;
        document.getElementById("viewportHeight").value = height;
        setViewport(width, height);
      });
      document.getElementById("viewportWidth").addEventListener("change", () => {
        document.getElementById("viewportPreset").value = "custom";
        updateViewportFromInputs();
      });
      document.getElementById("viewportHeight").addEventListener("change", () => {
        document.getElementById("viewportPreset").value = "custom";
        updateViewportFromInputs();
      });
      document.getElementById("reloadPreview").addEventListener("click", () => iframe.contentWindow.location.reload());
      iframe.addEventListener("load", applyToIframe);

      document.getElementById("undoButton").addEventListener("click", () => {
        if (!undoStack.length) return;
        redoStack.push(snapshot());
        state = JSON.parse(undoStack.pop());
        syncInputs();
        render();
      });
      document.getElementById("redoButton").addEventListener("click", () => {
        if (!redoStack.length) return;
        undoStack.push(snapshot());
        state = JSON.parse(redoStack.pop());
        syncInputs();
        render();
      });
      document.getElementById("productionReset").addEventListener("click", () => {
        restore(productionValues);
        announce("現在の本番値を基準に戻しました。");
      });
      document.getElementById("initialReset").addEventListener("click", () => {
        restore(initialValues);
        announce("ツールの初期値へ戻しました。");
      });
      document.getElementById("clearSaved").addEventListener("click", () => {
        try { localStorage.removeItem(STORAGE_KEY); } catch (_) {}
        restore(initialValues);
        announce("保存状態を削除しました。");
      });
      document.getElementById("copyCss").addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(output.value);
          announce("CSSをコピーしました。");
        } catch (_) {
          output.focus();
          output.select();
          document.execCommand("copy");
          announce("CSSをコピーしました。");
        }
      });

      loadSavedState();
      createPanel();
      syncInputs();
      setViewport(844, 390);
      render();
    })();
  </script>
</body>
</html>
