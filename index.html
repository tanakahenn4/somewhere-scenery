<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全国猫図鑑Nekomap</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    font-family: "Segoe UI", sans-serif;
  }

  #app {
    --side-navigation-width: 46px;
    --side-panel-width: 350px;
    --top-bar-height: 40px;
    height: 100%;
    display: flex;
    flex-direction: column;
    position: relative;
    background: #000;
  }

  #app:fullscreen {
    width: 100vw;
    height: 100vh;
  }

  #topBar {
    flex: 0 0 var(--top-bar-height);
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    box-sizing: border-box;
    color: #fff;
    background: #000000;
  }

  #siteTitle {
    font-size: 18px;
    line-height: 1;
    letter-spacing: 2px;
    text-align: center;
  }

  #mapContainer {
    flex: 1;
    min-height: 0;
    position: relative;
  }

  #map {
    width: calc(100% - var(--side-navigation-width));
    height: 100%;
  }

  #fullscreenButton {
    position: absolute;
    top: calc(var(--top-bar-height) + 10px);
    right: calc(var(--side-navigation-width) + 10px);
    z-index: 1001;
    width: 40px;
    height: 40px;
    padding: 0;
    margin: 0;
    border: 0;
    border-radius: 2px;
    background: rgba(0,0,0,0.55);
    color: #fff;
    font-size: 22px;
    line-height: 40px;
    cursor: pointer;
  }

  #fullscreenButton:hover {
    background: rgba(0,0,0,0.75);
  }

  #streetViewCoverageButton {
    display: block;
    white-space: nowrap;
    cursor: pointer;
  }

  #streetViewCoverageButton:hover {
    background: rgba(0,0,0,0.75);
  }

  #streetViewCoverageButton[aria-pressed="true"] {
    background: #1a73e8;
  }

  .marker-title-label {
    width: 320px;
    overflow: visible;
    white-space: nowrap;
    text-align: left;
    text-shadow:
      -1px -1px 0 #000,
       1px -1px 0 #000,
      -1px  1px 0 #000,
       1px  1px 0 #000,
       0 1px 3px #000;
    pointer-events: none;
  }

  #sceneryDetailCard {
    position: absolute;
    top: 12px;
    right: calc(var(--side-navigation-width) + var(--side-panel-width) + 12px);
    z-index: 1001;
    width: 320px;
    max-width: max(0px, calc(100% - var(--side-navigation-width) - var(--side-panel-width) - 36px));
    padding: 14px 16px;
    box-sizing: border-box;
    color: #fff;
    background: rgba(28,28,28,0.9);
    border: 1px solid rgba(255,255,255,0.22);
    border-radius: 4px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.35);
  }

  #sceneryDetailCard[hidden] {
    display: none;
  }

  #sceneryDetailTitle {
    margin: 0;
    font-size: 17px;
    line-height: 1.4;
    overflow-wrap: anywhere;
  }

  #sceneryDetailMemo {
    margin: 10px 0 0;
    color: #eee;
    font-size: 13px;
    line-height: 1.6;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  #sceneryDetailDate {
    display: block;
    margin-top: 10px;
    color: #bbb;
    font-size: 11px;
  }

  #sceneryDetailMemo[hidden],
  #sceneryDetailDate[hidden] {
    display: none;
  }

  #sceneryDetailActions:empty {
    display: none;
  }

  #sidePanelOverlay {
    position: absolute;
    inset: 0;
    z-index: 1002;
    overflow: hidden;
    pointer-events: none;
  }

  #sidePanel {
    position: absolute;
    top: 0;
    right: var(--side-navigation-width);
    bottom: 0;
    display: flex;
    flex-direction: column;
    width: min(var(--side-panel-width), calc(100% - var(--side-navigation-width)));
    box-sizing: border-box;
    color: #fff;
    background: rgba(35,35,35,0.97);
    box-shadow: -3px 0 12px rgba(0,0,0,0.35);
    transform: translateX(calc(100% + var(--side-navigation-width)));
    transition: transform 0.25s ease;
    pointer-events: none;
  }

  #sidePanel.is-open {
    transform: translateX(0);
    pointer-events: auto;
  }

  #sidePanelHeader {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 48px;
    padding: 8px 10px 8px 16px;
    box-sizing: border-box;
    border-bottom: 1px solid rgba(255,255,255,0.2);
  }

  #sidePanelCloseButton {
    width: 34px;
    height: 34px;
    padding: 0;
    margin: 0;
    border: 0;
    border-radius: 3px;
    color: #fff;
    background: transparent;
    font-size: 24px;
    line-height: 34px;
    cursor: pointer;
  }

  #sidePanelCloseButton:hover {
    background: rgba(255,255,255,0.12);
  }

  #sidePanelContent {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding: 16px;
  }

  .sidePanelPage[hidden] {
    display: none;
  }

  .sidePanelMenuButton {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    margin: 0 0 10px;
    padding: 12px;
    box-sizing: border-box;
    color: #fff;
    background: #444;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 4px;
    text-align: left;
    cursor: pointer;
  }

  .sidePanelMenuButton:hover,
  .sidePanelBackButton:hover {
    background: #555;
  }

  .sidePanelMenuButton small {
    display: block;
    margin-top: 4px;
    color: #ccc;
    font-size: 12px;
  }

  .sidePanelMenuArrow {
    margin-left: 12px;
    font-size: 20px;
  }

  .sidePanelInlineSection {
    margin: 0 0 10px;
    padding: 12px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 4px;
  }

  .sidePanelInlineSection h2,
  .sidePanelPage > h2 {
    margin: 0 0 8px;
    font-size: 17px;
  }

  .sidePanelInlineSection p,
  .sidePanelPlaceholder {
    margin: 0;
    color: #ccc;
    font-size: 13px;
    line-height: 1.5;
  }

  .sidePanelBackButton {
    margin: 0 0 14px;
    padding: 6px 10px;
    color: #fff;
    background: #444;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 3px;
    cursor: pointer;
  }

  .sidePanelFutureTabs,
  .sidePanelAboutList {
    margin: 14px 0 0;
    color: #ddd;
    font-size: 13px;
    line-height: 1.7;
  }

  .sidePanelFutureTabs {
    display: flex;
    gap: 8px;
  }

  .sidePanelFutureTabs span {
    padding: 4px 10px;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 3px;
  }

  .sidePanelFutureTabs .is-active {
    background: #555;
    border-color: rgba(255,255,255,0.45);
  }

  #latestSceneryList {
    margin-top: 10px;
    border-top: 1px solid rgba(255,255,255,0.14);
  }

  .sceneryListItem {
    display: grid;
    grid-template-columns: 24px minmax(0, 1fr);
    gap: 8px;
    align-items: center;
    width: 100%;
    margin: 0;
    padding: 8px 4px;
    box-sizing: border-box;
    color: #fff;
    background: transparent;
    border: 0;
    border-bottom: 1px solid rgba(255,255,255,0.12);
    text-align: left;
    cursor: pointer;
  }

  .sceneryListItem:hover {
    background: rgba(255,255,255,0.08);
  }

  .sceneryListIcon {
    width: 22px;
    height: 22px;
    object-fit: contain;
  }

  .sceneryListText {
    min-width: 0;
  }

  .sceneryListTitle {
    display: block;
    overflow: hidden;
    font-size: 13px;
    font-weight: 600;
    line-height: 1.35;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .sceneryListMeta {
    display: block;
    overflow: hidden;
    margin-top: 2px;
    color: #bbb;
    font-size: 11px;
    line-height: 1.35;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .sceneryListEmpty {
    margin: 12px 0 0;
    color: #bbb;
    font-size: 13px;
  }

  #mapTypeSettings {
    margin: 0;
    padding: 12px;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 4px;
  }

  #mapTypeSettings legend {
    padding: 0 4px;
    font-weight: 600;
  }

  #mapTypeSettings label {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 0;
    cursor: pointer;
  }

  #mapTypeSettings input {
    margin: 0;
  }

  #sideNavigationRail {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    z-index: 2;
    display: flex;
    width: var(--side-navigation-width);
    box-sizing: border-box;
    background: #000000;
    border-left: 1px solid rgba(255,255,255,0.25);
    pointer-events: auto;
  }

  #sidePanelToggleButton {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 4px;
    width: 100%;
    height: 100%;
    padding: 14px 2px 6px;
    margin: 0;
    border: 0;
    color: #fff;
    background: transparent;
    cursor: pointer;
  }

  #sidePanelToggleIcon {
    font-size: 24px;
    line-height: 1;
  }

  #sidePanelToggleLabel {
    font-size: 11px;
    line-height: 1.2;
  }

  #sidePanelToggleButton:hover,
  #sidePanelToggleButton[aria-expanded="true"] {
    background: rgba(55,55,55,0.96);
  }

  #layerMenuPanel {
    min-width: 0;
    padding: 0;
    color: #fff;
    background: transparent;
  }

  #layerMenuPanel[hidden] {
    display: none;
  }

  #layerMenuPanel strong {
    display: block;
    margin-bottom: 6px;
  }

  #layerMenuActions {
    display: flex;
    gap: 6px;
    margin-bottom: 6px;
  }

  #layerMenuActions button {
    flex: 1;
    margin: 0;
    padding: 3px 6px;
    color: #fff;
    background: #444;
    border: 1px solid #a7a5a5;
    border-radius: 3px;
    font-size: 12px;
    cursor: pointer;
  }

  #layerMenuActions button:hover {
    background: #555;
  }

  #layerMenuPanel label {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 4px 0;
    white-space: nowrap;
    cursor: pointer;
  }

  #layerMenuPanel input {
    margin: 0;
  }

  #registrationModal {
    position: absolute;
    inset: 0;
    z-index: 1100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    box-sizing: border-box;
    background: rgba(0,0,0,0.45);
  }

  #registrationModal[hidden] {
    display: none;
  }

  #registrationDialog {
    width: min(360px, 100%);
    max-height: 100%;
    overflow-y: auto;
    padding: 16px;
    box-sizing: border-box;
    color: #fff;
    background: #333;
    border: 1px solid #a7a5a5;
    border-radius: 6px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.45);
  }

  #registrationDialog strong {
    display: block;
    margin-bottom: 10px;
    font-size: 18px;
  }

  #registrationCategoryOptions {
    margin: 0 0 12px;
    padding: 0;
    border: 0;
  }

  #registrationCategoryOptions legend {
    margin-bottom: 3px;
    font-weight: 600;
  }

  #registrationCategoryOptions label {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 0;
    cursor: pointer;
  }

  #registrationDialog input {
    margin: 0;
  }

  .registrationField {
    display: block;
    margin: 0 0 12px;
  }

  .registrationField > span,
  .registrationField > .registrationFieldLabel {
    display: block;
    margin-bottom: 4px;
    font-weight: 600;
  }

  #registrationDialog .registrationTextInput {
    width: 100%;
    box-sizing: border-box;
    color: #fff;
    background: #222;
    border: 1px solid #a7a5a5;
  }

  #registrationDialog textarea.registrationTextInput {
    min-height: 80px;
    resize: vertical;
  }

  #registrationPasswordInputWrapper {
    position: relative;
  }

  #registrationPasswordInput {
    padding-right: 42px;
  }

  #registrationPasswordVisibilityButton {
    position: absolute;
    top: 50%;
    right: 1px;
    width: 38px;
    height: calc(100% - 2px);
    padding: 0;
    margin: 0;
    border: 0;
    color: #ddd;
    background: transparent;
    transform: translateY(-50%);
    cursor: pointer;
  }

  #registrationPasswordVisibilityButton:hover {
    color: #fff;
    background: rgba(255,255,255,0.1);
  }

  #registrationPasswordVisibilityButton svg {
    width: 19px;
    height: 19px;
    vertical-align: middle;
    fill: none;
    stroke: currentColor;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-width: 2;
  }

  #registrationPasswordHelp,
  #registrationPasswordNotice {
    margin: 5px 0 0;
    line-height: 1.4;
  }

  #registrationPasswordNotice {
    color: #ccc;
    font-size: 12px;
  }

  #registrationActions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 12px;
  }

  #registrationActions button {
    margin: 0;
    color: #fff;
    background: #444;
    border: 1px solid #a7a5a5;
    cursor: pointer;
  }

  #registrationActions button:hover {
    background: #555;
  }

 #controls {
    padding: 1px;
    background: #000000;
    color: #ffffff;  /* 文字を白に */
    display: flex;
    align-items: center;
    gap: 4px;
    flex-wrap: wrap;
    box-sizing: border-box;
    position: relative;
}

#searchResults {
    display: none;
    position: absolute;
    left: 0;
    right: 0;
    bottom: 100%;
    z-index: 1002;
    max-height: min(50vh, 260px);
    overflow-y: auto;
    padding: 4px;
    background: #444444;
    border: 1px solid #a7a5a5;
}

#searchResults.visible {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

#searchResults .search-result-button {
    width: 100%;
    margin: 0;
    text-align: left;
}

#compass-container {
  position: absolute;
  bottom: 80px;
  left: 10px;
  z-index: 1000;
  width: 50px;
  height: 50px;
}

#controls input,
#controls textarea,
#controls button {
    background: #333;  /* 入力欄やボタンも暗めに */
    color: #fff;       /* 文字白 */
    border: 1px solid #a7a5a5; /* 薄い境界線 */
}

#controls button:hover {
    background: #555;  /* ホバーで少し明るく */
}

  button, input {
    padding: 6px 10px;
    margin-right: 5px;
    font-size: 14px;
  }
  textarea {
    width: 100%;
    height: 80px;
    margin-top: 5px;
    font-family: monospace;
  }

  #controls > strong,
#jsonInput,
#searchJsonButton {
  display: none;
}

@font-face {
  font-family: 'PopRumCute';
  src: url('PopRumCute.otf') format('opentype');
  font-weight: normal;
  font-style: normal;
}

@media (max-width: 700px) {
  #app {
    --side-navigation-width: 42px;
  }

  #fullscreenButton {
    width: 34px;
    height: 34px;
    font-size: 20px;
    line-height: 34px;
  }

  #siteTitle {
    font-size: clamp(14px, 4.5vw, 18px);
    white-space: nowrap;
  }

  #controls {
    padding: 2px;
    gap: 3px;
    font-size: 12px;
  }

  #controls input,
  #controls button {
    height: 32px;
    padding: 4px 8px;
    margin-right: 0;
    font-size: clamp(12px, 3.4vw, 16px);
    box-sizing: border-box;
  }

  #addressInput {
    flex: 1 1 180px;
    min-width: 0;
    width: auto !important;
  }

  #controls button {
    flex: 0 0 auto;
  }

  #compass-container {
    bottom: 92px;
    width: 42px;
    height: 42px;
  }

  #compass {
    width: 42px;
    height: 42px;
  }
}

@media (max-width: 700px) and (orientation: portrait) {
  #controls {
    align-items: stretch;
  }

  #controls > div:first-child {
    flex: 0 0 auto;
  }

  #addressInput {
    flex-basis: calc(100% - 120px);
  }
}

@media (max-width: 700px) and (orientation: landscape) {
  #controls input,
  #controls button {
    height: 30px;
    font-size: clamp(12px, 2vw, 15px);
  }

}


</style>
</head>

<body>

<div id="app">
<header id="topBar">
  <div id="siteTitle">どこかの風景共有サイト</div>
</header>
<div id="mapContainer">
  <div id="map"></div>
  <section id="sceneryDetailCard" aria-label="風景の詳細" aria-live="polite" hidden>
    <h2 id="sceneryDetailTitle"></h2>
    <p id="sceneryDetailMemo" hidden></p>
    <time id="sceneryDetailDate" hidden></time>
    <div id="sceneryDetailActions" aria-label="投稿の操作"></div>
  </section>
  <div id="sidePanelOverlay">
    <aside id="sidePanel" aria-label="サイドパネル" aria-hidden="true">
      <div id="sidePanelHeader">
        <strong id="sidePanelPageTitle">メニュー</strong>
        <button id="sidePanelCloseButton" type="button" aria-label="サイドパネルを閉じる">×</button>
      </div>
      <div id="sidePanelContent">
        <section class="sidePanelPage" data-side-panel-page="home">
          <button class="sidePanelMenuButton" type="button" data-side-panel-target="scenery-list">
            <span>
              <b>登録されたどこかの風景リスト</b>
              <small>登録された景色の一覧を表示します</small>
            </span>
            <span class="sidePanelMenuArrow" aria-hidden="true">›</span>
          </button>

          <section class="sidePanelInlineSection" aria-labelledby="displaySettingsTitle">
            <h2 id="displaySettingsTitle">表示切替</h2>
            <div id="layerMenuPanel">
              <strong>表示するもの</strong>
              <div id="layerMenuActions">
                <button id="showAllMarkersButton" type="button">すべて表示</button>
                <button id="hideAllMarkersButton" type="button">すべて非表示</button>
              </div>
              <label><input type="checkbox" value="cat" checked>ねこ</label>
              <label><input type="checkbox" value="interesting_scenery" checked>気になった景色</label>
              <label><input type="checkbox" value="strange_funny" checked>不思議・おもしろい景色</label>
              <label><input type="checkbox" value="creepy" checked>不気味</label>
              <label><input type="checkbox" value="other" checked>その他</label>
            </div>
          </section>

          <button class="sidePanelMenuButton" type="button" data-side-panel-target="settings">
            <span>
              <b>設定</b>
              <small>地図表示などの設定を追加する予定です</small>
            </span>
            <span class="sidePanelMenuArrow" aria-hidden="true">›</span>
          </button>

          <button class="sidePanelMenuButton" type="button" data-side-panel-target="about">
            <span>
              <b>このサイトの説明</b>
              <small>使い方や利用上の注意を掲載する予定です</small>
            </span>
            <span class="sidePanelMenuArrow" aria-hidden="true">›</span>
          </button>
        </section>

        <section class="sidePanelPage" data-side-panel-page="scenery-list" hidden>
          <button class="sidePanelBackButton" type="button" data-side-panel-target="home">← 戻る</button>
          <h2>登録されたどこかの風景リスト</h2>
          <div class="sidePanelFutureTabs" aria-label="今後追加予定の一覧切替">
            <span class="is-active">最新</span>
            <span>人気（準備中）</span>
          </div>
          <div id="latestSceneryList" role="list"></div>
        </section>

        <section class="sidePanelPage" data-side-panel-page="settings" hidden>
          <button class="sidePanelBackButton" type="button" data-side-panel-target="home">← 戻る</button>
          <h2>設定</h2>
          <fieldset id="mapTypeSettings">
            <legend>地図の種類</legend>
            <label><input type="radio" name="mapType" value="roadmap">地図</label>
            <label><input type="radio" name="mapType" value="satellite">航空写真</label>
          </fieldset>
        </section>

        <section class="sidePanelPage" data-side-panel-page="about" hidden>
          <button class="sidePanelBackButton" type="button" data-side-panel-target="home">← 戻る</button>
          <h2>このサイトの説明</h2>
          <ul class="sidePanelAboutList">
            <li>どこかの風景共有サイトとは</li>
            <li>景色の登録方法</li>
            <li>SV ON/OFFとは？</li>
            <li>マーカーの種類について</li>
            <li>削除依頼</li>
            <li>利用上の注意</li>
            <li>問い合わせ</li>
          </ul>
        </section>
      </div>
    </aside>
    <nav id="sideNavigationRail" aria-label="サイト操作">
      <button id="sidePanelToggleButton" type="button" aria-label="サイドパネルを開く" aria-controls="sidePanel" aria-expanded="false">
        <span id="sidePanelToggleIcon" aria-hidden="true">☰</span>
        <span id="sidePanelToggleLabel">MENU</span>
      </button>
    </nav>
  </div>
</div>
<button id="fullscreenButton" type="button" title="全画面表示" aria-label="全画面表示">⛶</button>
<div id="registrationModal" hidden>
  <form id="registrationDialog" role="dialog" aria-modal="true" aria-labelledby="registrationTitle">
    <strong id="registrationTitle">景色を登録</strong>
    <fieldset id="registrationCategoryOptions">
      <legend>ジャンル</legend>
      <label><input type="radio" name="registrationCategory" value="cat" checked>ねこ</label>
      <label><input type="radio" name="registrationCategory" value="interesting_scenery">気になった景色</label>

<script>
let map, panorama, coverageLayer;
let markers = [];
let resetZoomOnEnter = true;
let pendingMarkerData = null;
const STORAGE_KEY = "catsmap_markers";
const markerCategories = ["cat", "interesting_scenery", "strange_funny", "creepy", "other"];
const markerIconUrls = {
  cat: "https://cdn-icons-png.flaticon.com/512/1864/1864514.png",
  interesting_scenery: "icons/interesting_scenery.png",
  strange_funny: "icons/strange_funny.png",
  creepy: "icons/creepy.png",
  other: "icons/other.png"
};
const MARKER_TITLE_LABEL_WIDTH = 320;
const MARKER_TITLE_LABEL_GAP = 6;
const visibleMarkerCategories = new Set(markerCategories);



let lastPanoramaPos = { lat: 35.6812, lng: 139.7671 }; // 初期中心（東京駅）

function initMap() {
  const initialCenter = { lat: 35.6812, lng: 139.7671 };
  map = new google.maps.Map(document.getElementById("map"), {
    center: initialCenter,
    zoom: 7,
    mapTypeControl: false,
    fullscreenControl: false
  });
  coverageLayer = new google.maps.StreetViewCoverageLayer();
  panorama = map.getStreetView();
  panorama.setOptions({ fullscreenControl: false });
  panorama.setVisible(false);

  loadSavedMarkers();
  setupFullscreenButton();
  setupStreetViewCoverageButton();
  setupLayerMenu();
  setupRegistrationDialog();
  setupSidePanel();
  setupMapTypeSettings();

    panorama.addListener('pov_changed', () => {
    const heading = panorama.getPov().heading;
    const arrow = document.getElementById('compass-arrow');
    if (arrow) {
      arrow.setAttribute('transform', `rotate(${-heading},25,25)`);
    }
  });

  panorama.addListener("zoom_changed", () => {
    updateMarkerIconSizes();
  });

  panorama.addListener("visible_changed", () => {
    if (panorama.getVisible()) {
   if (resetZoomOnEnter) {
    panorama.setPov({ heading: 0, pitch: 0, zoom: 1 });
}
    } else {
      hideSceneryDetailCard();
      const center = lastPanoramaPos;
      map.setCenter(center);
      map.setZoom(20);
      resetZoomOnEnter = true;
      updateMarkerIconSizes();
    }
    updateMarkerTitleLabels();
  });

  panorama.addListener("position_changed", () => {
    const pos = panorama.getPosition();
    if (pos) lastPanoramaPos = { lat: pos.lat(), lng: pos.lng() };
    updateMarkerIconSizes();
  });

  document.getElementById("getPosButton").addEventListener("click", () => {
    if (!panorama.getVisible()) return alert("ストリートビューが表示されていません。");
    const pos = panorama.getPosition();
    const pov = panorama.getPov();
    const panoId = panorama.getPano();

    openRegistrationDialog({
      lat: pos.lat(),
      lng: pos.lng(),
      heading: pov.heading,
      pitch: pov.pitch,
      zoom: pov.zoom,
      pano: panoId
    });
  });

  const addressInput = document.getElementById("addressInput");
  addressInput.addEventListener("keydown", event => {
    if (event.key !== "Enter" || event.isComposing) return;
    event.preventDefault();
    if (!addressInput.value.trim()) return;
    searchAddressOrPano();
  });

  document.getElementById("searchJsonButton").addEventListener("click", () => {
    try {
      const data = JSON.parse(document.getElementById("jsonInput").value);
      if (!data.lat || !data.lng) return alert("JSONに必要な情報がありません。");
      showPanorama(data);
    } catch {
      alert("正しいJSONを入力してください。");
    }
  });

  document.getElementById("loadDataButton").addEventListener("click", () => {
    markers.forEach(m => m.setMap(null));
    markers = [];
    loadSavedMarkers();
  });

  window.addEventListener("resize", () => {
    updateMarkerIconSizes();
  });
}

async function searchAddressOrPano() {
    const input = document.getElementById("addressInput").value.trim();
    if (!input) return;

    clearSearchResults();

    try {
      const streetViewService = new google.maps.StreetViewService();
      const { data } = await streetViewService.getPanorama({ pano: input });
      if (data && data.location && data.location.pano) {
        panorama.setPano(data.location.pano);
        panorama.setPov({ heading: 0, pitch: 0, zoom: 1 });
        panorama.setVisible(true);
        return;
      }
    } catch (e) {
      // Pano IDでなければ、通常の場所検索へ進む
    }

    try {
      const { Place } = await google.maps.importLibrary("places");
      const { places } = await Place.searchByText({
        textQuery: input,
        fields: ["displayName", "formattedAddress", "location", "viewport", "types"],
        locationBias: map.getBounds() || map.getCenter(),
        maxResultCount: 5,
        language: "ja",
        region: "jp"
      });

      showSearchResults(places);
    } catch (e) {
      console.warn("場所検索エラー:", e);
      alert("場所を検索できませんでした。Places APIの設定を確認してください。");
    }
}

function setupLayerMenu() {
  const panel = document.getElementById("layerMenuPanel");
  const checkboxes = panel.querySelectorAll('input[type="checkbox"]');

  checkboxes.forEach(checkbox => {
    checkbox.addEventListener("change", () => {
      if (checkbox.checked) visibleMarkerCategories.add(checkbox.value);
      else visibleMarkerCategories.delete(checkbox.value);
      updateMarkerVisibility();
    });
  });

  document.getElementById("showAllMarkersButton").addEventListener("click", () => {
    checkboxes.forEach(checkbox => checkbox.checked = true);
    markerCategories.forEach(category => visibleMarkerCategories.add(category));
    updateMarkerVisibility();
  });

  document.getElementById("hideAllMarkersButton").addEventListener("click", () => {
    checkboxes.forEach(checkbox => checkbox.checked = false);
    visibleMarkerCategories.clear();
    updateMarkerVisibility();
  });
}

function setupMapTypeSettings() {
  const options = document.querySelectorAll('input[name="mapType"]');

  const updateSelection = () => {
    const currentMapType = map.getMapTypeId();
    options.forEach(option => {
      option.checked = option.value === currentMapType;
    });
  };

  options.forEach(option => {
    option.addEventListener("change", () => {
      if (option.checked) map.setMapTypeId(option.value);
    });
  });

  map.addListener("maptypeid_changed", updateSelection);
  updateSelection();
}

function getCreatedAtMillis(createdAt) {
  let milliseconds = NaN;

  if (createdAt && typeof createdAt.toMillis === "function") {
    milliseconds = createdAt.toMillis();
  } else if (createdAt && typeof createdAt.toDate === "function") {
    milliseconds = createdAt.toDate().getTime();
  } else if (createdAt instanceof Date) {
    milliseconds = createdAt.getTime();
  } else if (typeof createdAt === "number") {
    milliseconds = createdAt;
  } else if (typeof createdAt === "string") {
    milliseconds = Date.parse(createdAt);
  }

  return Number.isFinite(milliseconds) ? milliseconds : null;
}

function showSceneryDetailCard(jsonData = {}) {
  const card = document.getElementById("sceneryDetailCard");
  const titleElement = document.getElementById("sceneryDetailTitle");
  const memoElement = document.getElementById("sceneryDetailMemo");
  const dateElement = document.getElementById("sceneryDetailDate");
  const title = typeof jsonData.title === "string" && jsonData.title.trim()
    ? jsonData.title.trim()
    : "名称未設定";
  const memo = typeof jsonData.memo === "string" ? jsonData.memo.trim() : "";
  const createdAtMillis = getCreatedAtMillis(jsonData.createdAt);

  titleElement.textContent = title;
  memoElement.textContent = memo;
  memoElement.hidden = !memo;

  if (createdAtMillis === null) {
    dateElement.hidden = true;
    dateElement.removeAttribute("datetime");
    dateElement.textContent = "";
  } else {
    const createdAt = new Date(createdAtMillis);
    dateElement.dateTime = createdAt.toISOString();
    dateElement.textContent = `登録日：${new Intl.DateTimeFormat("ja-JP", {
      year: "numeric",
      month: "numeric",
      day: "numeric"
    }).format(createdAt)}`;
    dateElement.hidden = false;
  }

  card.hidden = false;
}

function hideSceneryDetailCard() {
  document.getElementById("sceneryDetailCard").hidden = true;
}

function getLatestSceneryMarkers(limit = 10) {
  return markers
    .map((marker, index) => ({
      marker,
      index,
      createdAtMillis: getCreatedAtMillis(marker.jsonData.createdAt)
    }))
    .sort((a, b) => {
      if (a.createdAtMillis === null && b.createdAtMillis === null) {
        return a.index - b.index;
      }
      if (a.createdAtMillis === null) return 1;
      if (b.createdAtMillis === null) return -1;
      return b.createdAtMillis - a.createdAtMillis || a.index - b.index;
    })
    .slice(0, limit);
}

function getSavedPanoramaView(jsonData = {}) {
  const pano = typeof jsonData.pano === "string" ? jsonData.pano.trim() : "";
  if (!pano) return null;

  const numberOrDefault = (value, defaultValue) => {
    if (value === null || value === undefined || value === "") return defaultValue;
    const number = Number(value);
    return Number.isFinite(number) ? number : defaultValue;
  };

  return {
    pano,
    heading: numberOrDefault(jsonData.heading, 0),
    pitch: numberOrDefault(jsonData.pitch, 0),
    zoom: numberOrDefault(jsonData.zoom, 1)
  };
}

function renderLatestSceneryList() {
  const container = document.getElementById("latestSceneryList");
  if (!container) return;

  const entries = getLatestSceneryMarkers();
  const dateFormatter = new Intl.DateTimeFormat("ja-JP", {
    year: "numeric",
    month: "numeric",
    day: "numeric"
  });
  container.replaceChildren();

  if (!entries.length) {
    const emptyMessage = document.createElement("p");
    emptyMessage.className = "sceneryListEmpty";
    emptyMessage.textContent = "登録された景色はまだありません。";
    container.appendChild(emptyMessage);
    return;
  }

  entries.forEach(({ marker, createdAtMillis }) => {
    const jsonData = marker.jsonData;
    const locationName = typeof jsonData.locationName === "string"
      ? jsonData.locationName.trim()
      : "";
    const title = typeof jsonData.title === "string" && jsonData.title.trim()
      ? jsonData.title.trim()
      : locationName || "名称未設定";
    const registeredDate = createdAtMillis === null
      ? "日時不明"
      : dateFormatter.format(new Date(createdAtMillis));
    const item = document.createElement("div");
    const button = document.createElement("button");
    const icon = document.createElement("img");
    const text = document.createElement("span");
    const titleElement = document.createElement("span");
    const metaElement = document.createElement("span");

    item.setAttribute("role", "listitem");
    button.type = "button";
    button.className = "sceneryListItem";
    button.title = title;
    icon.className = "sceneryListIcon";
    icon.src = markerIconUrls[jsonData.category || "cat"] || markerIconUrls.cat;
    icon.alt = "";
    icon.setAttribute("aria-hidden", "true");
    text.className = "sceneryListText";
    titleElement.className = "sceneryListTitle";
    titleElement.textContent = title;
    metaElement.className = "sceneryListMeta";
    metaElement.textContent = [locationName !== title ? locationName : "", registeredDate]
      .filter(Boolean)
      .join(" ・ ");

    button.addEventListener("click", () => {
      const savedPanoramaView = getSavedPanoramaView(jsonData);

      if (savedPanoramaView) {
        showPanorama(savedPanoramaView, jsonData);
      } else {
        hideSceneryDetailCard();
        const position = marker.getPosition();
        if (position) {
          if (panorama && panorama.getVisible()) panorama.setVisible(false);
          map.panTo(position);
        }
      }
    });

    text.append(titleElement, metaElement);
    button.append(icon, text);
    item.appendChild(button);
    container.appendChild(item);
  });
}

const sidePanelPageTitles = {
  home: "メニュー",
  "scenery-list": "風景一覧",
  settings: "設定",
  about: "このサイトの説明"
};

function showSidePanelPage(pageId) {
  const content = document.getElementById("sidePanelContent");
  const pages = content.querySelectorAll("[data-side-panel-page]");
  const targetPage = content.querySelector(`[data-side-panel-page="${pageId}"]`);

  pages.forEach(page => {

function setupSidePanel() {
  const panel = document.getElementById("sidePanel");
  const toggleButton = document.getElementById("sidePanelToggleButton");

  const setOpen = isOpen => {

async function getCoarseLocationName(lat, lng) {
  try {
    const geocoder = new google.maps.Geocoder();
    const { results } = await geocoder.geocode({
      location: { lat, lng },
      region: "jp"
    });
    const components = results?.[0]?.address_components || [];
    const locationTypes = [
      "administrative_area_level_1",
      "administrative_area_level_2",
      "locality",
      "sublocality_level_1",
      "sublocality_level_2",
      "sublocality_level_3",
      "neighborhood"
    ];
    const names = [];

    locationTypes.forEach(type => {
      const component = components.find(item => item.types.includes(type));
      if (component?.long_name && !names.includes(component.long_name)) {
        names.push(component.long_name);
      }
    });

    return names.join("") || "名称未設定";
  } catch (error) {
    console.warn("地名取得エラー:", error);
    return "名称未設定";
  }
}

function bytesToBase64(bytes) {
  let binary = "";
  bytes.forEach(byte => binary += String.fromCharCode(byte));
  return btoa(binary);
}

async function hashEditPassword(password) {
  if (!window.crypto?.subtle) {
    throw new Error("このブラウザでは安全なパスワード処理を利用できません。");
  }

  const iterations = 600000;
  const salt = window.crypto.getRandomValues(new Uint8Array(16));
  const keyMaterial = await window.crypto.subtle.importKey(
    "raw",
    new TextEncoder().encode(password),
    "PBKDF2",
    false,
    ["deriveBits"]
  );
  const hash = await window.crypto.subtle.deriveBits(
    { name: "PBKDF2", hash: "SHA-256", salt, iterations },
    keyMaterial,
    256
  );

  return `pbkdf2-sha256$${iterations}$${bytesToBase64(salt)}$${bytesToBase64(new Uint8Array(hash))}`;
}

function openRegistrationDialog(markerData) {
  const modal = document.getElementById("registrationModal");
  const form = document.getElementById("registrationDialog");
  const titleInput = document.getElementById("registrationTitleInput");
  const confirmButton = document.getElementById("confirmRegistrationButton");
  const registrationData = { ...markerData, locationName: "名称未設定" };

  pendingMarkerData = registrationData;
  form.reset();
  titleInput.value = "地名を取得中…";
  titleInput.disabled = true;
  confirmButton.disabled = true;
  modal.hidden = false;
  form.querySelector('input[name="registrationCategory"]:checked').focus();

  getCoarseLocationName(markerData.lat, markerData.lng).then(locationName => {
    if (pendingMarkerData !== registrationData) return;
    registrationData.locationName = locationName;
    titleInput.value = locationName;
    titleInput.disabled = false;
    confirmButton.disabled = false;
    titleInput.focus();
  });
}

function setupRegistrationDialog() {
  const modal = document.getElementById("registrationModal");
  const form = document.getElementById("registrationDialog");
  const titleInput = document.getElementById("registrationTitleInput");
  const memoInput = document.getElementById("registrationMemoInput");
  const passwordInput = document.getElementById("registrationPasswordInput");
  const passwordVisibilityButton = document.getElementById("registrationPasswordVisibilityButton");
  const confirmButton = document.getElementById("confirmRegistrationButton");
  const cancelButton = document.getElementById("cancelRegistrationButton");

  const setPasswordVisible = isVisible => {
    passwordInput.type = isVisible ? "text" : "password";
    passwordVisibilityButton.setAttribute("aria-pressed", String(isVisible));
    passwordVisibilityButton.setAttribute(
      "aria-label",
      isVisible ? "パスワードを隠す" : "パスワードを表示"
    );
    passwordVisibilityButton.title = isVisible ? "パスワードを隠す" : "パスワードを表示";
  };

  const closeDialog = () => {
    modal.hidden = true;
    pendingMarkerData = null;
    form.reset();
    setPasswordVisible(false);
    titleInput.disabled = false;
  };

  passwordVisibilityButton.addEventListener("click", () => {
    setPasswordVisible(passwordInput.type === "password");
    passwordInput.focus({ preventScroll: true });
  });

  cancelButton.addEventListener("click", closeDialog);

  form.addEventListener("submit", async event => {
    event.preventDefault();
    if (!pendingMarkerData) return;

    const selectedCategory = form.querySelector(
      'input[name="registrationCategory"]:checked'
    )?.value;
    if (!markerCategories.includes(selectedCategory)) {
      alert("ジャンルを選択してください。");
      return;
    }

    const password = passwordInput.value;
    if (!password) {
      alert("編集・削除用パスワードを入力してください。");
      passwordInput.focus();
      return;
    }

    confirmButton.disabled = true;
    cancelButton.disabled = true;
    try {
      const locationName = pendingMarkerData.locationName || "名称未設定";
      const editPasswordHash = await hashEditPassword(password);
      const jsonData = {
        category: selectedCategory,
        ...pendingMarkerData,
        title: titleInput.value.trim() || locationName,
        memo: memoInput.value.trim(),
        locationName,
        editPasswordHash,
        ownerUid: null,
        createdAt: window.firebaseServerTimestamp(),
        migratedAt: null
      };
      const docRef = await window.firebaseAddDoc(
        window.firebaseCollection(window.firebaseDB, "mapMarkers"),
        jsonData
      );
      addMarker(jsonData, true, docRef.id);
      renderLatestSceneryList();
      closeDialog();
    } catch (e) {
      console.error("マーカー保存エラー:", e);
      alert("マーカーを保存できませんでした。");
    } finally {
      confirmButton.disabled = false;
      cancelButton.disabled = false;
    }
  });
}

function getMarkerCategory(marker) {
  return marker.jsonData.category ?? "cat";
}

function applyMarkerVisibility(marker) {
  marker.setMap(visibleMarkerCategories.has(getMarkerCategory(marker)) ? map : null);
}

function updateMarkerVisibility() {
  markers.forEach(applyMarkerVisibility);
}

function clearSearchResults() {
  const container = document.getElementById("searchResults");
  container.replaceChildren();
  container.classList.remove("visible");
}

function showSearchResults(places) {
  const container = document.getElementById("searchResults");
  const candidates = places.filter(place => place.location).slice(0, 5);

  if (!candidates.length) {
    alert("検索候補が見つかりませんでした。");
    return;
  }

  candidates.forEach(place => {
    const button = document.createElement("button");
    const name = place.displayName || "名称不明";
    const address = place.formattedAddress || "住所情報なし";
    button.type = "button";
    button.className = "search-result-button";
    button.textContent = `${name} — ${address}`;
    button.addEventListener("click", () => {
      if (panorama.getVisible()) panorama.setVisible(false);

      if (place.viewport) {
        map.fitBounds(place.viewport);
      } else {
        map.setCenter(place.location);
        map.setZoom(getSearchResultZoom(place.types));
      }

      clearSearchResults();
    });
    container.appendChild(button);
  });

  container.classList.add("visible");
}

function getSearchResultZoom(types = []) {
  if (types.includes("administrative_area_level_1")) return 8;
  if (types.includes("locality") || types.includes("administrative_area_level_2")) return 12;
  if (types.includes("route")) return 15;
  return 17;
}

function setupFullscreenButton() {
  const app = document.getElementById("app");
  const button = document.getElementById("fullscreenButton");
  if (!app || !button) return;

  button.addEventListener("click", async () => {
    try {
      if (document.fullscreenElement === app) {
        await document.exitFullscreen();
      } else {
        await app.requestFullscreen();
      }
    } catch (e) {
      console.warn("全画面表示の切り替えに失敗しました:", e);
    }
  });

  document.addEventListener("fullscreenchange", () => {
    const isFullscreen = document.fullscreenElement === app;
    button.textContent = isFullscreen ? "×" : "⛶";
    button.title = isFullscreen ? "全画面を終了" : "全画面表示";
    button.setAttribute("aria-label", button.title);

    setTimeout(() => {
      const center = map && map.getCenter ? map.getCenter() : null;
      if (map) google.maps.event.trigger(map, "resize");
      if (center) map.setCenter(center);
      updateMarkerIconSizes();
    }, 100);
  });
}

function getCatMarkerSize(jsonData = {}) {
  const width = window.innerWidth || document.documentElement.clientWidth || 1024;
  const baseSize = Math.max(50, Math.min(60, width * 0.1));
  let zoomScale = 1;
  let distanceScale = 1;

  if (panorama && panorama.getVisible()) {
    const currentZoom = Number(panorama.getPov().zoom);
    const registeredZoom = 1;

    if (Number.isFinite(currentZoom) && Number.isFinite(registeredZoom)) {
      const zoomDelta = currentZoom - registeredZoom;
      zoomScale = Math.pow(1.6, zoomDelta);
    }

    distanceScale = getCatDistanceScale(jsonData);
  }

  const size = Math.round(Math.max(32, Math.min(220, baseSize * zoomScale * distanceScale)));
  return new google.maps.Size(size, size);
}

function getCatDistanceScale(jsonData = {}) {
  const pos = panorama && panorama.getPosition ? panorama.getPosition() : null;
  if (!pos) return 1;

  const distance = getDistanceMeters(
    { lat: pos.lat(), lng: pos.lng() },
    { lat: jsonData.lat, lng: jsonData.lng }
  );

  if (!Number.isFinite(distance)) return 1;

  const scale = Math.sqrt(28 / Math.max(distance, 1));
  return Math.max(0.45, Math.min(5.9, scale));
}

function getDistanceMeters(a, b) {
  const latA = Number(a.lat);
  const lngA = Number(a.lng);
  const latB = Number(b.lat);
  const lngB = Number(b.lng);
  if (![latA, lngA, latB, lngB].every(Number.isFinite)) return NaN;

  const earthRadius = 6371000;
  const toRad = value => value * Math.PI / 180;
  const dLat = toRad(latB - latA);
  const dLng = toRad(lngB - lngA);
  const rLatA = toRad(latA);
  const rLatB = toRad(latB);
  const h =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(rLatA) * Math.cos(rLatB) * Math.sin(dLng / 2) ** 2;

  return 2 * earthRadius * Math.asin(Math.sqrt(h));
}

function getCatMarkerIcon(jsonData = {}) {
  const scaledSize = getCatMarkerSize(jsonData);
  const category = jsonData.category || "cat";

  return {
    url: markerIconUrls[category] || markerIconUrls.cat,
    scaledSize,
    anchor: new google.maps.Point(
      scaledSize.width / 2,
      scaledSize.height * 0.95
    ),
    labelOrigin: new google.maps.Point(
      scaledSize.width + MARKER_TITLE_LABEL_GAP + MARKER_TITLE_LABEL_WIDTH / 2,
      scaledSize.height / 2
    )
  };
}

function getMarkerTitleLabel(jsonData = {}) {
  const title = typeof jsonData.title === "string" ? jsonData.title.trim() : "";
  if (!title || (panorama && panorama.getVisible())) return null;

  return {
    text: title,
    color: "#fff",
    fontFamily: '"Segoe UI", sans-serif',
    fontSize: "13px",
    fontWeight: "600",
    className: "marker-title-label"
  };
}

function updateMarkerTitleLabels() {
  markers.forEach(marker => {
    marker.setLabel(getMarkerTitleLabel(marker.jsonData));
  });
}

function updateMarkerIconSizes() {
  if (!window.google || !google.maps) return;

  markers.forEach(marker => {
    marker.setIcon(getCatMarkerIcon(marker.jsonData));
  });
}

function addMarker(jsonData, focus = false, firestoreId = null) {
  const marker = new google.maps.Marker({
    position: { lat: jsonData.lat, lng: jsonData.lng },
    map: map,
    title: "🐈 猫発見！",
    icon: getCatMarkerIcon(jsonData),
    label: getMarkerTitleLabel(jsonData)
  });
  marker.firestoreId = firestoreId;
  marker.jsonData = jsonData;

  // 🐾 クリックイベントで判定
 const meowSound = new Audio('meow.mp3'); // 同じフォルダに置いた音声ファイル

marker.addListener("click", async (e) => {
  if (e.domEvent.shiftKey) {
    if (confirm("この猫マーカーを削除しますか？🐈")) {
      if (confirm("本当に削除しますか？🙀")) {
        if (!marker.firestoreId) {
          alert("このマーカーのFirestore IDが見つかりません。");
          return;
        }

        try {
          await window.firebaseDeleteDoc(
            window.firebaseDoc(window.firebaseDB, "mapMarkers", marker.firestoreId)
          );
          marker.setMap(null);
          markers = markers.filter(m => m !== marker);
          renderLatestSceneryList();
        } catch (error) {
          console.error("マーカー削除エラー:", error);
          alert("マーカーを削除できませんでした。");
        }
      }
    }
  } else {
    // 普通のクリック → ストリートビュー
    showPanorama(jsonData);

    // 猫の鳴き声再生
    meowSound.currentTime = 0; // 何度もクリックできるように先頭に戻す
    meowSound.play();
  }
});



  markers.push(marker);
  applyMarkerVisibility(marker);
  if (focus) map.setCenter(marker.getPosition());
}

function setupStreetViewCoverageButton() {
  const button = document.getElementById("streetViewCoverageButton");
  const streetViewService = new google.maps.StreetViewService();

  button.addEventListener("click", () => {
    const isVisible = coverageLayer.getMap() === map;
    coverageLayer.setMap(isVisible ? null : map);
    map.setOptions({ draggableCursor: isVisible ? null : "pointer" });
    button.textContent = isVisible ? "SV OFF" : "SV ON";
    button.setAttribute("aria-pressed", String(!isVisible));
    button.title = isVisible
      ? "Street View対応範囲を表示"
      : "Street View対応範囲を非表示";
    button.setAttribute("aria-label", button.title);
  });

  map.addListener("click", async event => {
    if (coverageLayer.getMap() !== map || !event.latLng) return;

    try {
      const { data } = await streetViewService.getPanorama({
        location: event.latLng,
        radius: 50
      });

      if (coverageLayer.getMap() !== map) return;
      if (!data?.location?.pano) throw new Error("Street View panorama not found");

      showPanorama({
        pano: data.location.pano,
        heading: 0,
        pitch: 0,
        zoom: 1
      });
    } catch (e) {
      if (coverageLayer.getMap() !== map) return;
      console.warn("Street View検索エラー:", e);
      alert("この地点の近くにStreet Viewが見つかりませんでした。");
    }
  });
}

function showPanorama(data, detailData = null) {
  if (detailData) showSceneryDetailCard(detailData);
  else hideSceneryDetailCard();
  resetZoomOnEnter = false;
  if (data.pano) panorama.setPano(data.pano);
  else panorama.setPosition({ lat: data.lat, lng: data.lng });
  panorama.setPov({
    heading: data.heading,
    pitch: data.pitch,
    zoom: data.zoom
  });
  panorama.setVisible(true);
  updateMarkerIconSizes();
}

async function loadSavedMarkers() {
  // Firebaseの準備待ち
  while (!window.firebaseDB || !window.firebaseGetDocs || !window.firebaseCollection) {
    console.log("⏳ Firebase準備待ち...");
    await new Promise(resolve => setTimeout(resolve, 100));
  }

  const snap = await window.firebaseGetDocs(
    window.firebaseCollection(window.firebaseDB, "mapMarkers")
  );

  snap.forEach(snapshot => {
    const jsonData = snapshot.data();
    jsonData.category ??= "cat";
    addMarker(jsonData, false, snapshot.id);
  });
  renderLatestSceneryList();

  if (snap.size) {
    console.log(`🐾 ${snap.size} 件の猫をFirestoreから復元しました`);
  } else {
    console.log("🐾 Firestoreに保存データはまだありません");
  }
}



</script>
