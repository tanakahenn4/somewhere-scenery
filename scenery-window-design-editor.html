<style>

.field.changed .field-head label{color:#7e3eb2;font-weight:bold}.value-row{display:flex;gap:5px;margin-top:4px}.value-row input[type=text]{width:100%;font:12px/1.5 Consolas,monospace}

<body>
<header><h1>どこかの風景 / デザイン調整エディター</h1><p>プレビュー内をクリック、または右の一覧から編集対象を選択。変更はこの画面内だけに反映されます。</p></header>
<div class="layout">
<section class="preview-pane" aria-label="デザインプレビュー">
<div class="preview-tools"><label><input id="showSelection" type="checkbox" checked>選択枠を表示</label><span id="selectionLabel">読み込み中…</span></div>

</section>
<aside class="panel" aria-label="CSS編集パネル">
<div class="target-picker">
<label for="target">編集対象</label><select id="target" disabled></select><div class="selector" id="selector"></div>
<div class="actions"><button id="resetTarget" disabled>選択中の要素だけリセット</button><button id="resetAll" disabled>変更をリセット</button></div>

</div>

<p id="message" role="status"></p><p class="hint">空欄または各項目の「戻す」で、そのプロパティの変更を解除します。再読み込みすると初期状態に戻るため、終了前にCSSをコピーしてください。</p></section>
</aside>
</div>

<!doctype html>
<html lang="ja">
<head>

  <style>
    /* PC向けの独立した静的モック。外部素材・本番CSS・JavaScriptは使用しない。 */

    :root { color-scheme: light; font-family: "Segoe UI", "Yu Gothic UI", sans-serif; color: #211c1c; background: #eeedf3; }

    /* 外装はフラットな上端を持つ四角形。斜めの造形は内部のタイトル領域だけに限定する。

    .window-shell { position: relative; width: 500px; isolation: isolate; }
    .scenery-window {
      position: relative;
      isolation: isolate;
      padding: 0 6px 6px 5px;
      background: #82709e;
      border-radius: 2px;
    }
    .scenery-window::before {
      content: ""; position: absolute; inset: 2px; z-index: -1;
      background: linear-gradient(135deg, #d4a8ff 0, #d4a8ff 27%, #d4a8ff 75%, #d4a8ff 100%);
      border-radius: 1px;
    }
    /* 小さな接地線のみ。造形は影ではなくフレーム自身で表現する。 */
    .window-shell::after { content: ""; position: absolute; left: 15px; right: 15px; bottom: -3px; height: 3px; background: #8b81982e; z-index: -1; }

    .window-titlebar { position: relative; height: 38px; display: flex; align-items: center; padding: 0 4px; margin-left: 1px; }
    .title-tab {

    }
    .title-tab::before { content: ""; position: absolute; inset: 2px; z-index: -1; background: linear-gradient(120deg, #4432b7, #4432b7); clip-path: polygon(0 0, calc(100% - 23px) 0, 100% 100%, 0 100%); }
    .window-name { margin: 0; font-family: "Segoe UI", "Yu Gothic UI", sans-serif; font-size: 16px; font-weight: 320; letter-spacing: 0.02em; line-height: normal; text-shadow: none; white-space: nowrap; }
    .app-icon { position: relative; width: 17px; height: 17px; flex: none; border: 1px solid #fff4ff; background: #611a6f; box-shadow: 1px 1px #776097; }
    .app-icon::before { content: ""; position: absolute; inset: 3px; background: #9883ba; clip-path: polygon(0 100%, 0 70%, 36% 20%, 65% 65%, 100% 35%, 100% 100%); }
    .app-icon::after { content: ""; position: absolute; width: 3px; height: 3px; top: 3px; right: 3px; background: #fff9de; }
    .window-controls { display: flex; gap: 5px; margin-left: auto; }
    .window-control { position: relative; width: 29px; height: 25px; padding: 0; color: #644d81; background: #e9dcf4; border: 1px solid #ad95c7; box-shadow: inset 1px 1px #fff4ff, inset -1px -1px #c6b1dd; border-radius: 1px; }
    .window-control.is-close { background: #efd2e4; border-color: #bb99b8; color: #835b79; }
    .window-control::before, .window-control::after { content: ""; position: absolute; }
    .is-minimize::before { width: 10px; height: 2px; background: currentColor; left: 8px; top: 13px; }
    .is-maximize::before { width: 10px; height: 9px; border: 1px solid currentColor; border-top-width: 2px; left: 8px; top: 6px; }
    .is-close::before, .is-close::after { width: 12px; height: 1px; background: currentColor; left: 7px; top: 11px; transform: rotate(45deg); }
    .is-close::after { transform: rotate(-45deg); }

    /* 内側はフレームから一段沈んだ、独立した表示面。 */
    .window-content { padding: 21px 22px 20px; background: #e4d2df; border: 2px solid; border-color: #aa94bf #f8edff #f8edff #aa94bf; box-shadow: inset 1px 1px #e1d3e6; }
    .scenery-count { display: flex; align-items: center; justify-content: space-between; margin: 0 0 22px; padding-bottom: 18px; border-bottom: 1px solid transparent; width: 434px; height: 32px; }
    .count-label { font-size: 16px; letter-spacing: .025em; margin-bottom: 7px; }
    .count-value { min-width: 15px; padding: 2px 12px 5px; text-align: center; color: #735390; background: #eee2f4; border: 1px solid #d0bbde; box-shadow: inset 1px 1px #fcf8ff; font: 28px/1 Consolas, monospace; letter-spacing: -.06em; font-variant-numeric: tabular-nums; height: 37px; }
    .filter-heading { margin: 0 0 12px; font-size: 17px; font-weight: 400; letter-spacing: .06em; color: #100f10; margin-left: 1px; margin-top: -19px; }
    .filter-actions { display: flex; gap: 8px; margin-bottom: 14px; }
    .filter-actions button { min-height: 31px; padding: 5px 14px; color: #654b79; background: #e9ddef; border: 1px solid #bda6cf; box-shadow: inset 1px 1px #fff7ff, inset -1px -1px #d8c6e5; font-size: 12px; border-radius: 1px; }
    .filter-actions button:last-child { background: #f8eff7; }
    .category-list { display: grid; gap: 0; }
    .category-option { display: flex; align-items: center; gap: 12px; min-height: 25px; padding: 2px 3px; border-bottom: 1px solid transparent; font-size: 14px; line-height: 1.5; }
    .category-option:last-child { border-bottom: 0; }
    .checkbox { flex: none; position: relative; display: inline-block; width: 17px; height: 17px; background: #a38bc7; border: 1px solid #9276b9; box-shadow: inset 1px 1px #c2addc, 1px 1px #fff; }
    .checkbox::after { content: ""; position: absolute; left: 5px; top: 2px; width: 4px; height: 8px; border: solid #fffaff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
    .frame-grip { height: 4px; width: 38px; position: absolute; bottom: 6px; right: 26px; background: repeating-linear-gradient(115deg, transparent 0 4px, #9880b3 4px 5px, #eadcf6 5px 6px, transparent 6px 9px); }
    .preview-heading, .preview-note { display: none; }
    body { min-width: 0; }
    .stage { min-height: 740px; padding: 48px 40px; place-items: start center; border: 0; }
  </style>
</head>
<body>
  <header class="preview-heading">
    <p class="eyebrow">SOMEWHERE SCENERY / CASE STUDY 04</p>
    <h1>四角いフレームに、斜めのタイトルライン。</h1>
    <p>ラベンダーの外装の内側で、紫のタイトル領域から操作領域へ斜めに切り替わる造形。</p>

  <main class="stage">
    <div class="window-shell">
      <article class="scenery-window" aria-labelledby="windowName">

              <div class="category-option"><span class="checkbox" aria-hidden="true"></span><span>ねこ</span></div>
              <div class="category-option"><span class="checkbox" aria-hidden="true"></span><span>気になった景色</span></div>
              <div class="category-option"><span class="checkbox" aria-hidden="true"></span><span>不思議・おもしろい景色</span></div>
              <div class="category-option"><span class="checkbox" aria-hidden="true"></span><span>不気味</span></div>

  <p class="preview-note">PC向け・幅500pxの造形確認用モックアップです。操作部は見た目のみで、チェック切替・ウィンドウ操作は実装していません。<br>本番サイトのファイルやデータは読み込まず、HTML / CSSだけで描画しています。</p>

<script>
'use strict';
// 作成時のプレビュー全文を埋め込み、file://でも単体で動作させる。
// 対象定義とプロパティ群を分離し、編集項目を追加しやすくする。
const groups = {
  text: ['文字', ['font-family','font-size','font-weight','line-height','letter-spacing','color','text-shadow']],
  size: ['サイズ', ['width','height','min-width','min-height']],
  space: ['余白・間隔', ['padding','padding-top','padding-right','padding-bottom','padding-left','margin','margin-top','margin-right','margin-bottom','margin-left','gap']],
  position: ['位置', ['left','right','top','bottom']],
  look: ['外観', ['background','border','border-width','border-color','border-radius','box-shadow','opacity']],
  shape: ['斜め形状', ['clip-path']]
};
const targets = [
  ['shell','ウィンドウ全体の幅・位置','.window-shell',['size','space','position']],
  ['frame','ウィンドウ外枠','.scenery-window',['size','space','look']],
  ['frameFace','外枠・内側の面','.scenery-window::before',['position','look']],
  ['titlebar','タイトルバー全体','.window-titlebar',['size','space','look']],
  ['tab','斜めのタイトル領域','.title-tab',['size','space','position','look','shape']],
  ['tabFace','タイトル領域・内側の面','.title-tab::before',['position','look','shape']],
  ['title','タイトル「どこかの風景」','.window-name',['text','size','space']],
  ['controls','ウィンドウ操作ボタンの並び','.window-controls',['space']],
  ['control','ウィンドウ操作ボタン（共通）','.window-control',['size','space','look','text']],
  ['close','閉じるボタン','.window-control.is-close',['size','look','text']],
  ['content','本文領域','.window-content',['size','space','look','text']],
  ['countRow','登録数の行','.scenery-count',['size','space','look']],
  ['countLabel','「登録された風景」','.count-label',['text','space']],
  ['count','件数「27」','.count-value',['text','size','space','look']],
  ['filterTitle','「表示するもの」','.filter-heading',['text','space']],
  ['filterRow','一括表示ボタンの並び','.filter-actions',['space']],
  ['filterButton','すべて表示 / 非表示（共通）','.filter-actions button',['text','size','space','look']],
  ['hideButton','すべて非表示ボタン（個別）','.filter-actions button:last-child',['text','size','space','look']],
  ['list','カテゴリ一覧','.category-list',['size','space','look']],
  ['row','カテゴリ各行','.category-option',['size','space','look']],
  ['check','チェックボックスの四角','.checkbox',['size','space','look']],
  ['tick','チェックマーク','.checkbox::after',['size','position','look']],
  ['categoryText','カテゴリ文字','.category-option > span:last-child',['text','space']],
  ['grip','右下の斜線','.frame-grip',['size','position','look']]
].map(([id,label,selector,sections]) => ({id,label,selector,sections}));
const frame = document.getElementById('preview');
const picker = document.getElementById('target');
const fields = document.getElementById('fields');
const output = document.getElementById('cssOutput');
const changes = new Map();
const baseline = new Map();
let doc, baseSheet, editStyle, overlay, selected, probe;
const controls = new Map();

function splitTarget(target) {
  const match = target.selector.match(/(::before|::after)$/);
  return {selector: match ? target.selector.slice(0,-match[0].length) : target.selector, pseudo: match ? match[0] : null};
}
function normalized(property, value) {
  probe.style.cssText = '';
  probe.style.setProperty(property, value);
  return probe.style.getPropertyValue(property);
}
function initialValue(target, property) {
  let specified = '';
  for (const rule of baseSheet.cssRules) {
    if (rule.selectorText === target.selector && rule.style.getPropertyValue(property))
      specified = rule.style.getPropertyValue(property);
  }
  if (specified) return specified;
  const part = splitTarget(target);
  return doc.defaultView.getComputedStyle(doc.querySelector(part.selector), part.pseudo).getPropertyValue(property).trim();
}
function cssText() {
  return [...changes].filter(([,props]) => props.size).map(([id,props]) => {
    const target = targets.find(t => t.id === id);
    return target.selector + ' {\n' + [...props].map(([p,v]) => '  ' + p + ': ' + v + ';').join('\n') + '\n}';
  }).join('\n\n');
}
function refresh() {
  const css = cssText();
  editStyle.textContent = css;
  output.value = css;
  const total = [...changes.values()].reduce((n,props) => n+props.size,0);
  document.getElementById('changeCount').textContent = total ? '('+total+'項目)' : '(変更なし)';
  document.getElementById('copyCSS').disabled = !total;
  document.getElementById('resetAll').disabled = !total;
  document.getElementById('resetTarget').disabled = !changes.get(selected.id)?.size;
  requestAnimationFrame(highlight);
}
function applyValue(property, value, field, error) {
  value = value.trim();
  // 単一のCSS値のみ受け付ける。ルール全体の混入や外部URLを受け付けない。
  if (value && (/[;{}]|url\s*\(/i.test(value) || !CSS.supports(property,value))) {
    field.classList.add('invalid'); error.textContent = 'このプロパティで使えるCSS値を入力してください。'; return false;
  }
  field.classList.remove('invalid'); error.textContent = '';
  let props = changes.get(selected.id);
  const original = baseline.get(selected.id)[property];
  if (!value || normalized(property,value) === normalized(property,original)) {
    if (props) { props.delete(property); if (!props.size) changes.delete(selected.id); }
  } else {
    if (!props) { props = new Map(); changes.set(selected.id,props); }
    // 後から編集したショートハンド／個別辺がCSSでも後になるようにする。
    props.delete(property); props.set(property,value);
  }
  field.classList.toggle('changed',!!changes.get(selected.id)?.has(property));
  refresh(); return true;
}
function rangeConfig(property, value) {
  const m = value.trim().match(/^(-?\d*\.?\d+)(px|em|rem|%)?$/);
  if (!m) return null;
  const unit=m[2] || '';
  if(property==='font-weight') return {min:100,max:900,step:1,unit};
  if(property==='opacity') return {min:0,max:1,step:.01,unit};
  if(property==='line-height' && !unit) return {min:.5,max:4,step:.05,unit};
  if(unit==='em'||unit==='rem') return {min:property==='letter-spacing'?-.2:0,max:property==='letter-spacing'?1:5,step:.01,unit};
  if(unit==='%') return {min:0,max:100,step:1,unit};
  if(!unit && Number(m[1])!==0) return null;
  const negative=/^(margin|left|right|top|bottom|letter-spacing)/.test(property);
  const max=/width|height/.test(property)?900:property==='font-size'?72:120;
  return {min:negative?-100:0,max,step:property==='letter-spacing'?.1:1,unit:unit||(/weight|opacity|line-height/.test(property)?'':'px')};
}
function makeField(property, original) {
  const field=document.createElement('div'); field.className='field';
  const head=document.createElement('div'); head.className='field-head';
  const label=document.createElement('label'); label.textContent=property; label.htmlFor='edit-'+property;
  const undo=document.createElement('button'); undo.type='button'; undo.textContent='戻す'; undo.setAttribute('aria-label',property+'を初期値に戻す');
  head.append(label,undo);
  const row=document.createElement('div'); row.className='value-row';
  const input=document.createElement('input'); input.type='text'; input.id='edit-'+property; input.spellcheck=false;
  input.value=changes.get(selected.id)?.get(property) ?? original; input.placeholder=original;
  row.append(input);
  const range=document.createElement('input'); range.type='range'; range.setAttribute('aria-label',property+'のスライダー');
  const error=document.createElement('span'); error.className='error'; error.setAttribute('aria-live','polite');
  let color;
  if(['color','background','border-color'].includes(property)) {
    color=document.createElement('input'); color.type='color'; color.setAttribute('aria-label',property+'の色を選択');
    row.append(color);
  }
  function syncHelpers() {
    const config=rangeConfig(property,input.value);
    range.hidden=!config;
    if(config) {
      const number=parseFloat(input.value);
      range.min=Math.min(config.min,number); range.max=Math.max(config.max,number); range.step=config.step; range.value=number;
      range.dataset.unit=config.unit;
    }
    if(color) {
      // グラデーションや複数色指定はテキスト欄で編集。単色はピッカーも表示。
      color.hidden=!CSS.supports('color',input.value);
      if(!color.hidden) {
        const canvas=document.createElement('canvas'), ctx=canvas.getContext('2d');
        ctx.fillStyle='#000000'; ctx.fillStyle=input.value;
        const hex=ctx.fillStyle;
        if(/^#[0-9a-f]{6}$/i.test(hex)) color.value=hex;
        else { const nums=hex.match(/[\d.]+/g); if(nums?.length>=3) color.value='#'+nums.slice(0,3).map(n=>Math.round(+n).toString(16).padStart(2,'0')).join(''); }
      }
    }
  }
  input.addEventListener('input',()=>{if(applyValue(property,input.value,field,error))syncHelpers();});
  input.addEventListener('blur',()=>{if(!input.value.trim()){input.value=original;syncHelpers();}});
  range.addEventListener('input',()=>{input.value=range.value+range.dataset.unit;applyValue(property,input.value,field,error);});
  if(color)color.addEventListener('input',()=>{input.value=color.value;applyValue(property,input.value,field,error);syncHelpers();});
  undo.addEventListener('click',()=>{input.value=original;applyValue(property,'',field,error);syncHelpers();});
  field.classList.toggle('changed',!!changes.get(selected.id)?.has(property));
  field.append(head,row,range,error); syncHelpers(); controls.set(property,input); return field;
}
function selectTarget(id) {
  selected=targets.find(t=>t.id===id); picker.value=id;
  document.getElementById('selector').textContent=selected.selector;
  document.getElementById('selectionLabel').textContent=selected.label;
  controls.clear(); fields.replaceChildren();
  for(const section of selected.sections) {
    const [label,props]=groups[section];
    const details=document.createElement('details'); details.open=true;
    const summary=document.createElement('summary');summary.textContent=label;details.append(summary);
    for(const property of props)details.append(makeField(property,baseline.get(selected.id)[property]));
    fields.append(details);
  }
  refresh();
}
function highlight() {
  overlay.replaceChildren();
  if(!document.getElementById('showSelection').checked)return;
  const part=splitTarget(selected);
  // 疑似要素は直接クリックできないため、親の範囲を選択枠として表示する。
  for(const element of doc.querySelectorAll(part.selector)) {
    const r=element.getBoundingClientRect(), box=doc.createElement('div');
    Object.assign(box.style,{position:'fixed',left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px',outline:'1px dashed #e658b4',outlineOffset:'2px',pointerEvents:'none'});
    overlay.append(box);
  }
}
frame.addEventListener('load',()=>{
  doc=frame.contentDocument;
  if(!doc?.querySelector('.scenery-window'))return;
  baseSheet=doc.querySelector('style').sheet;probe=doc.createElement('span');
  for(const target of targets) {
    const props={};
    for(const group of target.sections) for(const property of groups[group][1])props[property]=initialValue(target,property);
    baseline.set(target.id,props);
    const option=document.createElement('option');option.value=target.id;option.textContent=target.label;picker.append(option);
  }
  editStyle=doc.createElement('style');doc.head.append(editStyle);
  overlay=doc.createElement('div');overlay.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:2147483647;';doc.body.append(overlay);
  doc.addEventListener('click',event=>{
    event.preventDefault();
    const hit=event.target;
    const priority=['title','close','control','countLabel','count','filterTitle','hideButton','filterButton','check','categoryText','grip','row','list','countRow','filterRow','controls','tab','titlebar','content','frame','shell'];
    for(const id of priority) {
      const target=targets.find(t=>t.id===id);
      if(hit.closest(target.selector)){selectTarget(id);break;}
    }
  });
  doc.addEventListener('scroll',highlight,true);
  new ResizeObserver(()=>requestAnimationFrame(highlight)).observe(doc.body);
  picker.disabled=false;selectTarget('frame');
});
picker.addEventListener('change',()=>selectTarget(picker.value));
document.getElementById('showSelection').addEventListener('change',highlight);
document.getElementById('resetTarget').addEventListener('click',()=>{changes.delete(selected.id);selectTarget(selected.id);});
document.getElementById('resetAll').addEventListener('click',()=>{changes.clear();selectTarget(selected.id);document.getElementById('message').textContent='すべて初期状態に戻しました。';});
document.getElementById('copyCSS').addEventListener('click',async()=>{
  const css=cssText();if(!css)return;
  const message=document.getElementById('message');
  try {
    if(!navigator.clipboard?.writeText)throw new Error('clipboard unavailable');
    await navigator.clipboard.writeText(css);message.textContent='変更したCSSをコピーしました。';
  } catch {
    output.focus();output.select();
    try { if(!document.execCommand('copy'))throw new Error('copy denied');message.textContent='変更したCSSをコピーしました。'; }
    catch {message.textContent='自動コピーが利用できません。選択中のCSSを Ctrl+C（Macは⌘C）でコピーしてください。';}
  }
});
const source=document.getElementById('sourceDocument').textContent;
// 周囲の説明だけ隠す。ウィンドウ本体の初期CSSには触れない。
frame.srcdoc=source.replace('</head>','<style>.preview-heading,.preview-note{display:none}body{min-width:0}.stage{min-height:740px;padding:48px 40px;place-items:start center;border:0}</style></head>');
</script>
